# The install count's endpoint (see worker.js). Not part of the npm package: package.json `files` does not list
# packaging/.
name = "crewforth-install-count"
main = "worker.js"
compatibility_date = "2026-10-01"
workers_dev = true

# No request logs: the Worker keeps nothing about a caller, and the platform's logs would.
[observability]
enabled = false

# Create it once with `npx wrangler kv namespace create COUNTS` and put the id it prints here.
[[kv_namespaces]]
binding = "COUNTS"
id = "REPLACE_WITH_THE_COUNTS_NAMESPACE_ID"
