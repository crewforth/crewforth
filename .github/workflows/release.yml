name: release

# Cut a release by bumping VERSION + package.json, dating the CHANGELOG heading, committing, then:
#   git tag vX.Y.Z && git push origin main --tags
# This workflow then builds the tarball + GitHub release and publishes to npm, all automatically.
#
# A rehearsal is tagged vX.Y.Z-rc.N on the same commit shape (VERSION stays X.Y.Z, the heading may still read
# "[Unreleased] — X.Y.Z"). It publishes a GitHub pre-release and npm under the `next` dist-tag only: `latest`,
# the plugin channel (plugin-stable) and the site do not move. packaging/release-check.sh decides which it is.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # create the GitHub release with GITHUB_TOKEN

jobs:
  release:
    runs-on: ubuntu-latest
    # The limit is on the job's own run (4 to 5 minutes measured); the wait for the approval comes before it starts.
    timeout-minutes: 20
    environment: release   # publish waits for manual approval (see repo → Environments → release)
    outputs:
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # e2e rehearses the 3.0 migration on the real v2.13.0 tree (git archive)

      # VERSION and package.json must match the tag, and the CHANGELOG's first heading must fit it: a final tag needs
      # "## [X.Y.Z] — YYYY-MM-DD", an rc may still read "## [Unreleased] — X.Y.Z". Outputs version (with any -rc.N),
      # base, prerelease and npm_tag.
      - name: Resolve version (VERSION, package.json and the CHANGELOG heading must fit the tag)
        id: v
        run: bash packaging/release-check.sh "$GITHUB_REF_NAME"

      - name: Verify the plugin edition is in sync
        run: |
          bash packaging/build-plugin.sh
          # `git diff` compares tracked files and is blind to new ones. Measured: with a committed
          # plugin/agents and a freshly generated, untracked plugin/studio, `git diff --quiet -- plugin`
          # exits 0 — so a whole new subtree the build emits but nobody committed would ship as an
          # absent directory, with this gate green. `git status --porcelain` sees both.
          if [ -n "$(git status --porcelain -- plugin)" ]; then
            echo "::error::plugin/ is out of sync with kit/. Run packaging/build-plugin.sh and commit."
            git --no-pager status --porcelain -- plugin
            git --no-pager diff --stat -- plugin
            exit 1
          fi

      # These gates run BEFORE anything is published, so a release cannot ship on top of a red smoke, routing or
      # e2e run. (This was the gate that was missing: release used to skip smoke/routing/e2e, so a green publish
      # could sit on a red CI.) They are not verify.sh's full set: syntax, manifests and studio run only in ci.yml.
      # And `environment: release` is job-level, so the approval is asked before any step of this job runs; once
      # approved, a run whose gates pass publishes with no further stop.
      - name: Verify — smoke test + routing eval
        run: |
          bash kit/eval/smoke-test.sh
          bash kit/eval/routing-eval.sh

      - name: Verify — installer e2e (start.sh combos + adopt.sh)
        run: bash packaging/e2e.sh

      - name: Build tarball
        run: bash make-release.sh

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.v.outputs.version }}"
          # make-release.sh names the archive from VERSION, which an rc leaves at X.Y.Z. The asset carries the tag's
          # own version, so an rc's download says it is one (rc.1 shipped as crewforth-3.0.0.tgz).
          TGZ="dist/crewforth-$V.tgz"
          [ -f "$TGZ" ] || mv "dist/crewforth-${{ steps.v.outputs.base }}.tgz" "$TGZ"
          {
            echo "## Install"
            echo
            echo "- **npx** — \`npx crewforth\` (fresh) · \`npx crewforth adopt\` (existing)"
            echo "- **Claude Code plugin** — \`/plugin marketplace add Crewforth/crewforth\` -> \`/plugin install crewforth@crewforth\`"
            echo "- **Tarball** — download below, then \`bash start.sh\` (fresh) or \`bash adopt.sh\` (existing)"
            echo
            echo "## What's new"
            echo
            # The first section: the release's own on a final tag, "[Unreleased] — X.Y.Z" on an rc.
            awk '/^## \[/{n++; next} n==1' CHANGELOG.md
            echo
            echo "Full changelog: [CHANGELOG.md](https://github.com/Crewforth/crewforth/blob/main/CHANGELOG.md)"
          } > release-notes.md
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file release-notes.md
            gh release upload "$GITHUB_REF_NAME" "$TGZ" --clobber
          else
            PRE=""; [ "${{ steps.v.outputs.prerelease }}" = true ] && PRE="--prerelease"
            gh release create "$GITHUB_REF_NAME" "$TGZ" --title "$GITHUB_REF_NAME" --notes-file release-notes.md $PRE
          fi

      # The plugin marketplace installs from the plugin-stable branch (.claude-plugin/marketplace.json), so the plugin
      # edition goes live here, inside the approved job and after its gates, not the moment the release PR merges.
      # Fast-forward only: pointing the branch at an older commit moves installed users back (measured: an update
      # from a ref at v2.9.0 took an installed 2.10.0 down to 2.9.0), and the branch's ruleset refuses it anyway.
      # Before npm on purpose: re-running a release whose npm publish already went through fails at npm, since the
      # version exists, so a step after it would never run.
      - name: Publish the plugin edition (advance plugin-stable)
        if: steps.v.outputs.prerelease != 'true'   # a rehearsal never reaches installed plugins
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/heads/plugin-stable" -f sha="${GITHUB_SHA}" -F force=false >/dev/null
          now="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/plugin-stable" --jq .object.sha)"
          [ "$now" = "${GITHUB_SHA}" ] || { echo "::error::plugin-stable is $now, not ${GITHUB_SHA}"; exit 1; }
          echo "plugin-stable advanced to ${GITHUB_SHA}"

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      # The repo README is rich (diagrams, collapsible sections, all install channels) — right for GitHub, noisy on
      # the npm page. Swap in the lean, npm-focused README for the published tarball ONLY (the commit is untouched).
      - name: Use the npm-flavoured README for the package
        run: |
          # The package must carry exactly one README. npm packs every root README.*, and with README.npm.md and
          # README.tr.md still beside README.md it chose README.tr.md for the npm page, which is what 2.10.0's page
          # showed. Its pick among several depends on directory order, so a single file is the only stable answer.
          if [ -f README.npm.md ]; then
            cp README.npm.md README.md
            rm -f README.npm.md README.tr.md
            echo "npm README staged for publish; README.npm.md and README.tr.md left out of the package"
          fi

      # A final publishes as `latest`. An rc takes its version from the tag in THIS checkout only (the repository keeps
      # X.Y.Z) and publishes as `next`, so `npx crewforth` still resolves the last final and `crewforth@next` the rc.
      - name: Publish to npm
        run: |
          if [ "${{ steps.v.outputs.prerelease }}" = true ]; then
            npm version "${{ steps.v.outputs.version }}" --no-git-tag-version
          fi
          npm publish --access public --tag "${{ steps.v.outputs.npm_tag }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # A final moves `latest` only, so `next` went on naming the rc before it (or an older final): `crewforth@next`
      # installed something older than `crewforth@latest`. After a final, `next` follows when what it names is older;
      # an rc of a LATER version stays. The release is published by now, so a failure here warns and does not fail.
      - name: Move npm's `next` to this final when it names something older
        if: steps.v.outputs.prerelease != 'true'
        run: |
          pkg="$(node -p "require('./package.json').name")"
          cur="$(npm view "$pkg" dist-tags.next 2>/dev/null || true)"
          if ! what="$(bash packaging/npm-next-tag.sh "${{ steps.v.outputs.version }}" "$cur")"; then
            echo "::warning::npm's next is '$cur': not a version this step compares, left as it is"; exit 0
          fi
          if [ "$what" = move ]; then
            npm dist-tag add "$pkg@${{ steps.v.outputs.version }}" next \
              && echo "next: ${cur:-nothing} -> ${{ steps.v.outputs.version }}" \
              || echo "::warning::could not move npm's next from '${cur:-nothing}' to ${{ steps.v.outputs.version }}; run: npm dist-tag add $pkg@${{ steps.v.outputs.version }} next"
          else
            echo "next stays at $cur (not older than ${{ steps.v.outputs.version }})"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # crewforth.com, from this tag: .github/workflows/site.yml, which can also be run by hand for a tag whose release ran
  # before Pages was ready. OFF by default: it runs only when the repository variable SITE_DEPLOY is 1, because until
  # the Pages source is set to "GitHub Actions" the deploy would fail, and a release must not stop on a site that is
  # not live yet — so the switch, not the tag, turns it on. An rc never publishes the site.
  site:
    needs: release
    if: vars.SITE_DEPLOY == '1' && needs.release.outputs.prerelease != 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/site.yml
    with:
      ref: ${{ github.ref_name }}
