name: ci

on:
  push:
    branches: [main, next]
  pull_request:

# Every gate below is defined ONCE, in packaging/verify.sh, and invoked here by name. The commands used to
# live in this file and nowhere else, which meant a developer's "green" was a strictly smaller claim than
# CI's: three eval suites locally, six gates here. A branch was pushed with all three suites green and CI
# failed on the one gate that had no local runner. Two copies of a rule drift, and the copy that drifts is
# the one nobody runs — so there is one copy, and `bash packaging/verify.sh` runs it.
#
# CREW_VERIFY_STRICT turns a skipped step into a failure. On a runner a missing tool is a broken runner, not
# an honest local limitation, and a gate that goes quiet on a broken runner reports success for a check
# nobody performed.
env:
  CREW_VERIFY_STRICT: "1"

# A new commit on a pull request makes the run for the previous one worthless, and on Windows that run is the
# longest job we have. Cancel it. Pushes to main and next are NOT cancelled: each one is a state that shipped,
# and every one of them keeps its own verdict.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Is this pull request documentation only? The macOS and Windows jobs measure how bash, git and the installers
  # behave on another OS; a README or a site page cannot change that, so they are skipped when nothing else
  # changed. The list lives in packaging/ci-docs-only.sh and is pinned by smoke (no script, no hook, nothing
  # under kit/). A push to main or next always runs everything, and so does anything the diff cannot be read for.
  # EVERY JOB HAS A TIME LIMIT. Without one a job runs for GitHub's default of 360 minutes: a Windows e2e that hung
  # in its rehearsal step sat there for three hours (its usual run is about 40 minutes), and nothing said so. The
  # limits are about twice the longest green run measured over the last eight (verify 9 min, macOS smoke 7, macOS
  # e2e 12, Windows smoke 30, Windows e2e 43), so a slow runner still finishes and a hung one is cut off.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
      site: ${{ steps.scope.outputs.site }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Documentation-only pull request?
        id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "${{ github.event_name }}" != pull_request ] || [ -z "$BASE" ]; then
            scope=code; site=yes
          else
            scope="$(git diff --name-only "$BASE" HEAD | bash packaging/ci-docs-only.sh)"
            git diff --name-only "$BASE" HEAD | sed 's/^/  changed: /'
            # The site is built from these, so a change to any of them rebuilds it — documentation-only included.
            site=no
            git diff --name-only "$BASE" HEAD | grep -qE '^(site/|kit/agents/|kit/skills/|kit/hooks/|kit/eval/gate-report\.sh$|kit/CLAUDE\.md$|assets/|README(\.tr)?\.md$|evals/README\.md$|CHANGELOG\.md$|packaging/[^/]*\.tsv$|\.github/workflows/ci\.yml$)' && site=yes
          fi
          echo "scope: $scope · site: $site"
          echo "scope=$scope" >> "$GITHUB_OUTPUT"
          echo "site=$site" >> "$GITHUB_OUTPUT"
      # Nothing in this repository is signed by a tool. The title and body come from the event payload, through env,
      # so the description is read as data; no request leaves the runner. A description edited after the last push
      # is read on the next push.
      - name: No signature line in the pull request
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s\n%s\n' "$PR_TITLE" "$PR_BODY" | bash packaging/check-attribution.sh

  # Skipped when the pull request changes nothing but the text of skills, agents or commands (and documentation):
  # packaging/ci-docs-only.sh answers `text` then. The push to next or main that follows the merge runs it.
  verify:
    needs: changes
    if: needs.changes.outputs.scope != 'text'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # e2e rehearses the 3.0 migration on the real v2.13.0 tree (git archive)

      - name: Syntax — shell scripts
        run: bash packaging/verify.sh syntax

      - name: Smoke test — source (unpruned, 12 agents)
        run: bash packaging/verify.sh smoke

      - name: Routing eval — behavioral (golden routing + held-out + agent conflicts)
        run: bash packaging/verify.sh routing

      # The gate must reach the same verdict whichever parser decoded the payload. It runs on every platform CI
      # covers because the answer differs BY PLATFORM: this runner has jq, a stock Windows desktop has neither
      # jq nor a python3 that runs, and the four incidents this step exists to prevent were all a tier CI
      # exercised behaving differently from the tier the user runs.
      - name: Parser conformance — every tier reaches the same verdict
        run: bash packaging/verify.sh parser

      # The installer's message tables. Here on every platform because the audit is awk, and whether gawk
      # (this runner, and Git Bash) and BSD awk (macOS) agree on it cannot be measured on one machine.
      - name: subshell audit — an assertion in a child shell is a silently green gate
        run: bash packaging/verify.sh subshell

      - name: i18n audit — the bilingual tables hold their invariants
        run: bash packaging/verify.sh i18n

      # The panel's own suite. Both statements this comment used to make are now false: the panel IS installed
      # into every project, and verify-cross does carry node (v24 on macOS, v22 on Windows in the run that
      # proved it). So it is no longer Linux-only — see the matching step in verify-cross-smoke.
      - name: Studio — boundary pins, permission bridge, transcript parsing
        run: bash packaging/verify.sh studio

      - name: Plugin & marketplace manifests valid (strict)
        # Offline manifest validation via the official CLI; --strict fails on unrecognized fields / missing
        # metadata. No API auth needed (this does not call the model). CI=true keeps it non-interactive.
        # The install is here rather than in verify.sh because verify.sh must never write to a machine.
        run: |
          npm install -g @anthropic-ai/claude-code
          bash packaging/verify.sh manifests

      - name: e2e rehearsal — start.sh (2 patterns + legacy flags) + adopt.sh (detection · overlap · refresh · migration)
        run: bash packaging/verify.sh e2e

  # The documentation site: generated from the repository and gated on what it builds (packaging/verify.sh site).
  # Linux only — it measures content, not how an OS runs bash — and in parallel with the rest, so it adds no wall
  # clock. NOT gated on ci-docs-only.sh: a documentation-only pull request is exactly the one that changes it.
  site:
    needs: changes
    if: needs.changes.outputs.site == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: site/.nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json
      # The install is here rather than in verify.sh because verify.sh must never write to a machine.
      - name: Install the site's dependencies (npm ci, from the lockfile)
        run: npm ci --prefix site --no-audit --no-fund
      - name: Site — build, text and link gates, generator twins
        run: bash packaging/verify.sh site

  # Cross-platform proof: the installer and the non-interactive settings SELF-HEAL must behave the same on Windows
  # (Git-Bash) and macOS, not only Linux — Windows especially, since that is where the update was failing. Runs the
  # OS-sensitive checks (syntax · smoke · studio · parser · subshell · i18n · e2e); the Linux job above owns the
  # manifest/catalogue checks.
  #
  # TWO JOBS PER OS, the same steps as the one job they replace: the suites share nothing, and on Windows each is
  # long (measured: smoke 18 min, e2e 22 min, 41 min in one job), so running them side by side makes the wall
  # clock the longer of the two instead of their sum.
  verify-cross-smoke:
    needs: changes
    if: needs.changes.outputs.scope == 'code'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 45 || 20 }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # e2e rehearses the 3.0 migration on the real v2.13.0 tree (git archive)

      - name: Syntax — shell scripts
        run: bash packaging/verify.sh syntax

      # On windows-latest ONLY, run this step with jq shadowed out. The runner image carries jq; a real user's
      # Git Bash usually does not, so the leg that was meant to be the Windows evidence has been re-proving the
      # jq path that ubuntu and macOS already cover, while the pure-bash path every Windows user actually takes
      # went untested. Measured before this change: 619 assertions here against 633 on the runner — fourteen
      # checks differ, and only two of them announced themselves as skips.
      #
      # The shadow is a stub that RESOLVES and FAILS, not a deleted binary, because that is the shape the kit
      # keeps meeting in the wild: Microsoft's Store redirector for `python3` is on PATH by default, passes
      # `command -v`, and exits 49 with empty stdout. Shadowing this way exercises the probe, not just absence.
      #
      # Only the smoke step. e2e runs its own with/without jq legs and must keep a real jq to do that.
      - name: Smoke test
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            mkdir -p "$RUNNER_TEMP/nojq"
            { echo '#!/bin/sh'; echo 'exit 49'; } > "$RUNNER_TEMP/nojq/jq"
            chmod +x "$RUNNER_TEMP/nojq/jq"
            export PATH="$RUNNER_TEMP/nojq:$PATH"
            hash -r
            # The shadow is itself a gate: if it did not take, this leg would silently go back to testing the
            # jq path and report that as Windows evidence. A measurement that can fail open is not a measurement.
            if printf '{}' | jq -e . >/dev/null 2>&1; then
              echo "FAIL: the jq shadow did not take — this leg would silently re-test the jq path"; exit 1
            fi
            echo "jq shadowed (resolves, exits 49) — the suite must now pick its next oracle tier"
          fi
          bash packaging/verify.sh smoke

      # The panel ships to every project on every platform, so its suite runs on every platform CI covers.
      # It was Linux-only while the panel was a repo-side tool; keeping it there now would leave the half of
      # the payload most likely to break on Windows unmeasured. Node is present on both runners.
      - name: Studio — boundary pins, permission bridge, transcript parsing
        run: bash packaging/verify.sh studio

      # Here for a sharper reason than on ubuntu: macOS ships jq with the OS and a stock Windows desktop has no
      # working decoder at all, so these two runners sit on OPPOSITE tiers. A divergence that hides on one of
      # them shows on the other, which is the asymmetry that produced every incident in this class.
      - name: Parser conformance — every tier reaches the same verdict
        run: bash packaging/verify.sh parser

      # The installer's message tables. Here on every platform because the audit is awk, and whether gawk
      # (this runner, and Git Bash) and BSD awk (macOS) agree on it cannot be measured on one machine.
      - name: subshell audit — an assertion in a child shell is a silently green gate
        run: bash packaging/verify.sh subshell

      - name: i18n audit — the bilingual tables hold their invariants
        run: bash packaging/verify.sh i18n

  verify-cross-e2e:
    needs: changes
    if: needs.changes.outputs.scope == 'code'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 60 || 20 }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # e2e rehearses the 3.0 migration on the real v2.13.0 tree (git archive)

      - name: e2e rehearsal — installer + non-interactive self-heal (with/without jq·python)
        run: bash packaging/verify.sh e2e
